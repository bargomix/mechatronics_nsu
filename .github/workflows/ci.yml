name: PR04 build, tests and evidence

on: [push, pull_request]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build launch and patrol, then run tests in pinned ROS image
        shell: bash
        run: |
          image="$(cat docker-image.txt)"
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --env ROS_LOG_DIR=/tmp/ros-logs \
            --mount "type=bind,source=$GITHUB_WORKSPACE,target=/work" \
            --workdir /work \
            "$image" bash -ec '
              source /opt/ros/jazzy/setup.bash
              colcon build --symlink-install --packages-select turtle_bringup patrol
              source install/setup.bash
              test -f "$(ros2 pkg prefix turtle_bringup)/share/turtle_bringup/launch/sim.launch.py"
              python3 -m py_compile src/turtle_bringup/launch/sim.launch.py
              ros2 pkg executables patrol | grep -Fx "patrol patrol"
              python3 -m pytest src/patrol/test
            '
      - name: Download pinned course kit
        shell: bash
        run: |
          kit_url="$(python3 -c 'import json; print(json.load(open("course-kit.lock.json"))["archive_url"])')"
          kit_sha256="$(python3 -c 'import json; print(json.load(open("course-kit.lock.json"))["sha256"])')"
          curl -fsSLo course-kit.tar.gz "$kit_url"
          printf '%s  %s\n' "$kit_sha256" course-kit.tar.gz | sha256sum -c -
          mkdir -p .course-kit
          tar -xzf course-kit.tar.gz -C .course-kit
      - name: Validate PR04 report JSON
        run: python3 -m json.tool evidence/pr04/report.json > /dev/null
      - name: Check PR04 evidence and Git history
        run: python3 .course-kit/v1/tools/check_practice.py PR04 --submission .
